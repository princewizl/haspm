name: Deploy to live

# Deliberately manual. Promote to haspm.com only after test.haspm.com looks right.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to deploy"
        required: true
        default: main
      confirm:
        description: 'Type "deploy" to confirm you mean production'
        required: true

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: live          # add required reviewers here for an approval gate
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation text did not match. Nothing was deployed."
            exit 1
          fi

      - name: Open SSH session
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
        run: |
          # Name the missing secret instead of failing silently further down.
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ]  || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null; then
            echo "::error::SSH_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi

          for i in 1 2 3; do
            ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed, retrying"; sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach $SSH_HOST on port 22 from GitHub Actions."
            exit 1
          fi

      - name: Back up the live database first
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "/opt/haspm/deploy/backup.sh live"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "REF=${{ github.event.inputs.ref }} /opt/haspm/deploy/deploy.sh live"

      - name: Verify
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://haspm.com/)
          title=$(curl -sS --max-time 20 https://haspm.com/ | grep -o '<title>[^<]*' | head -1)
          echo "haspm.com -> $code | $title"
          test "$code" = "200"

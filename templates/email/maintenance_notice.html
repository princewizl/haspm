<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:'Segoe UI',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5F9;padding:32px 16px">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%">

      <tr><td style="background:#0D3A6B;border-radius:14px 14px 0 0;padding:28px 32px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:#fff">HS Property Management</div>
        <div style="font-size:13px;color:#93C5FD;margin-top:4px">{{ heading }}</div>
      </td></tr>

      <tr><td style="background:#fff;padding:32px">
        <p style="margin:0 0 16px;font-size:14px;color:#1E293B">Hello {{ recipient_name }},</p>
        <div style="border-left:4px solid {{ ticket.cls.colour }};background:{{ ticket.cls.tint }};padding:12px 16px;border-radius:6px;margin-bottom:18px">
          <div style="font-size:12px;font-weight:700;color:{{ ticket.cls.colour }};text-transform:uppercase;letter-spacing:.05em">{{ ticket.cls.label }}</div>
          <div style="font-size:16px;font-weight:700;color:#1E293B;margin-top:4px">{{ ticket.title }}</div>
          <div style="font-size:12px;color:#64748B;margin-top:2px">{{ ticket.ticket_number }}{% if ticket.prop %} &middot; {{ ticket.prop.name }}{% endif %}</div>
        </div>
        <p style="margin:0;font-size:14px;color:#475569;line-height:1.6;white-space:pre-line">{{ body }}</p>
      </td></tr>

      <tr><td style="background:#F8FAFC;border-top:1px solid #E2E8F0;border-radius:0 0 14px 14px;padding:20px 32px;text-align:center">
        <p style="margin:0;font-size:12px;color:#94A3B8">HS Property Management &mdash; Maintenance notification.</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>

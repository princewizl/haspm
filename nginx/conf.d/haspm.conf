# HS Property Management — edge config
#   haspm.com, www.haspm.com  -> live stack
#   test.haspm.com            -> test stack
#
# Cert is a single Let's Encrypt certificate covering all three names, stored
# under /etc/letsencrypt/live/haspm.com/.

upstream haspm_live { server web-live:8000; }
upstream haspm_test { server web-test:8000; }

# Uploads are capped at 10 MB in the app; give nginx a little headroom so the
# app returns its own friendly error instead of nginx cutting the request off.
client_max_body_size 12m;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;

# ── Port 80: ACME challenge, everything else redirected ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name haspm.com www.haspm.com test.haspm.com;

    # Local healthcheck target, must not redirect.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Anything hitting the IP directly or an unknown hostname gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The container healthcheck calls http://localhost/healthz, which matches
    # no server_name and therefore lands here. It must answer.
    location = /healthz {
        access_log off;
        return 200 "ok
";
    }

    location / { return 444; }
}

# ── LIVE ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haspm.com www.haspm.com;

    ssl_certificate     /etc/letsencrypt/live/haspm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haspm.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/live.access.log;
    error_log  /var/log/nginx/live.error.log;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://haspm_live;
    }
}

# ── TEST ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.haspm.com;

    ssl_certificate     /etc/letsencrypt/live/haspm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haspm.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    # Keep staging out of search results.
    add_header X-Robots-Tag           "noindex, nofollow" always;

    access_log /var/log/nginx/test.access.log;
    error_log  /var/log/nginx/test.error.log;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://haspm_test;
    }
}
